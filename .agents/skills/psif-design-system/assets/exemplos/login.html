<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body>

<symbol id="psif-abrir-lista" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></symbol>
<symbol id="psif-fechar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></symbol>
<symbol id="psif-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></symbol>
<symbol id="psif-mais" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></symbol>

<symbol id="psif-inicio" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></symbol>
<symbol id="psif-inicio-ativo" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></symbol>
<symbol id="psif-atendimentos" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="16" rx="2"/><rect x="9" y="3" width="6" height="4" rx="1"/></symbol>
<symbol id="psif-atendimentos-ativo" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="16" rx="2"/><rect x="9" y="3" width="6" height="4" rx="1"/></symbol>
<symbol id="psif-alunos" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2c2.8.3 5 2.6 5 5.8"/></symbol>
<symbol id="psif-alunos-ativo" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6z"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2c2.8.3 5 2.6 5 5.8h-5z"/></symbol>

<symbol id="psif-relatorios-ativo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path fill="currentColor" stroke="none" d="M6 2h7.6l6.4 6.4V12a6 6 0 0 0-8.5 9H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><circle cx="16" cy="16" r="3"/><path d="M18.2 18.2L21 21"/></symbol>

<symbol id="psif-calendario" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/></symbol>

<symbol id="psif-notificacoes" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></symbol>
<symbol id="psif-termo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/><path d="M8 13h8"/><path d="M8 17h5"/></symbol>
<symbol id="psif-sair" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M9 8l-4 4 4 4"/><path d="M5 12h11"/></symbol>

<symbol id="psif-alerta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6"/><path d="M12 17h.01"/></symbol>
<symbol id="psif-busca" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
<symbol id="psif-email" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></symbol>
<symbol id="psif-cadeado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
<symbol id="psif-mostrar-senha" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
</svg>

<!-- Login (§13.4): cartão de autenticação (§9.8), campo sobre branco com
     borda (§8.3), "Mostrar senha" com aria-pressed (§20.7) e caixa de
     seleção (§8.7). O símbolo ocupa o lugar do logo coração-cérebro até o
     design decidir (§28.4). -->
<main id="conteudo" class="psif-autenticacao">
<section class="psif-cartao psif-cartao--autenticacao" aria-labelledby="t-login">
<p class="psif-logo-login"><img src="../simbolo-psif.svg" alt="" width="64" height="64">PSIF</p>
<h1 id="t-login" class="psif-autenticacao__subtitulo">Plataforma de Suporte Psicopedagógico</h1>

<form class="psif-pilha" action="#" novalidate>
<div class="psif-campo-grupo">
<label class="psif-rotulo" for="l-email">E-mail</label>
<div class="psif-campo psif-campo--borda">
<svg class="psif-ic" aria-hidden="true"><use href="#psif-email"></use></svg>
<input id="l-email" class="psif-campo__entrada" type="email" autocomplete="username" placeholder="nome@ifpb.edu.br">
</div>
</div>

<div class="psif-campo-grupo">
<label class="psif-rotulo" for="l-senha">Senha</label>
<div class="psif-campo psif-campo--borda psif-campo--com-botao">
<svg class="psif-ic" aria-hidden="true"><use href="#psif-cadeado"></use></svg>
<input id="l-senha" class="psif-campo__entrada" type="password" autocomplete="current-password">
<button type="button" class="psif-botao-icone" aria-label="Mostrar senha" aria-pressed="false" data-mostrar-senha="l-senha"><svg class="psif-ic" aria-hidden="true"><use href="#psif-mostrar-senha"></use></svg></button>
</div>
</div>

<div class="psif-autenticacao__linha">
<label class="psif-caixa"><input type="checkbox" name="lembrar">Lembrar-me</label>
<a class="psif-link" href="#">Esqueceu a senha?</a>
</div>

<button type="submit" class="psif-botao">Entrar</button>
</form>

<p class="psif-autenticacao__subtitulo">Não tem acesso? <a class="psif-link" href="#">Fale com a psicopedagoga do campus.</a></p>
<p class="psif-autenticacao__assinatura">Acesso restrito a quem a psicopedagoga do campus cadastrou.</p>
</section>
</main>
<script src="exemplos.js"></script>
</body>
</html>
