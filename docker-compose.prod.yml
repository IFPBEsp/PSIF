name: psif-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - psif-prod

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r0
    restart: unless-stopped
    command: server /bitnami/minio/data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER no .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no .env (mínimo de 8 caracteres)}
    volumes:
      - minio-data:/bitnami/minio/data
    networks:
      - psif-prod

  backend:
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    environment:
      APP_ENV: production
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    depends_on:
      - postgres
    security_opt:
      - no-new-privileges:true
    networks:
      - psif-prod

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?defina NEXT_PUBLIC_APP_URL no .env}
    restart: unless-stopped
    environment:
      APP_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?defina NEXT_PUBLIC_APP_URL no .env}
      API_INTERNAL_URL: ${API_INTERNAL_URL:?defina API_INTERNAL_URL no .env}
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
    networks:
      - psif-prod

volumes:
  postgres-data:
  minio-data:

networks:
  psif-prod:
    driver: bridge
